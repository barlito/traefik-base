api:
  dashboard: true
  insecure: false  # Disable insecure API access on port 8080

entryPoints:
  http:
    address: :80
    http: &entrypoint-http
      # Drop request headers whose name aliases another one (X_Auth_User or
      # X.Auth.User for X-Auth-User). PHP/CGI/WSGI backends read them as the
      # aliased header, which would let a client forge e.g. Remote_User past
      # the Authelia forwardAuth. (Traefik >= 3.7.12; default is "keep".)
      aliasHeadersStrategy: delete
    http2:
      maxConcurrentStreams: 250
  https:
    address: :443
    http: *entrypoint-http
    http2:
      maxConcurrentStreams: 250
    http3:
      advertisedPort: 444  # HTTP/3 on external 444/UDP (can't share 443 with TCP in Swarm); alt-svc advertises h3=":444"
  # Internal-only entrypoint for Prometheus metrics (not published to the host)
  metrics:
    address: :8082
    http: *entrypoint-http

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

global:
  sendAnonymousUsage: false

log:
  level: DEBUG  # Verbose for local development

# No access logs in local - use docker service logs instead

providers:
  swarm:
    # Reach the Swarm API through the read-only docker-socket-proxy instead of
    # the raw socket (which is no longer mounted into this container).
    endpoint: tcp://dockerproxy:2375
    exposedByDefault: false
    watch: true
    # Swarm is polled (no service events); default 15s delays routing after rollouts.
    refreshSeconds: 5
    network: traefik_traefik_proxy
  file:
    filename: /etc/traefik/dynamic/config.yml
    watch: true
