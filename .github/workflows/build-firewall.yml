name: Build firewall image

# Builds the firewall image (iptables ruleset baked in) and pushes it to GHCR.
# Run this BEFORE deploy-firewall whenever firewall/ changes.
#
# One-time setup: after the first push, set the package
# ghcr.io/barlito/traefik-base-firewall to PUBLIC (Packages > Package settings >
# Change visibility) so the server can pull it without credentials.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "firewall/**"
      - ".github/workflows/build-firewall.yml"

env:
  IMAGE: ghcr.io/barlito/traefik-base-firewall

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./firewall
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
