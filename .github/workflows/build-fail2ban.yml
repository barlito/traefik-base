name: Build fail2ban image

# Builds the fail2ban image (config baked in) and pushes it to GHCR.
# Run this BEFORE deploy-fail2ban whenever fail2ban/ changes.
#
# One-time setup: after the first push, set the package
# ghcr.io/barlito/traefik-base-fail2ban to PUBLIC (Packages > Package settings >
# Change visibility) so the server can pull it without credentials.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "fail2ban/**"
      - ".github/workflows/build-fail2ban.yml"

permissions: {}

concurrency:
  group: build-fail2ban
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/barlito/traefik-base-fail2ban

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./fail2ban
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
