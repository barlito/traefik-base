name: Deploy WireGuard VPN

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: barlito/ci/.github/workflows/swarm-deploy.yaml@v1
    with:
      target: deploy.vpn
      require-tag: false
      images: ""
      submodules: false
      env-secrets: WG_HOST
    secrets: inherit
