name: Deploy Traefik Stack

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: barlito/ci/.github/workflows/swarm-deploy.yaml@v1
    with:
      target: deploy.prod
      require-tag: false
      images: ""
      submodules: false
      env-secrets: DASHBOARD_HOST ACME_EMAIL AUTHELIA_JWT_SECRET AUTHELIA_SESSION_SECRET AUTHELIA_STORAGE_ENCRYPTION_KEY AUTHELIA_USER_PASSWORD_HASH WG_HOST
    secrets: inherit
