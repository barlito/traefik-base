# Bans IPs that saturate MaxStartups by holding dozens of parallel
# unauthenticated SSH connections. These lines are matched by NO standard
# fail2ban filter (the stock sshd filter tags them NOFAIL), yet this flood is
# exactly what makes sshd randomly drop legitimate connections — CI deploys
# included (docker compose over DOCKER_HOST=ssh opens one session per service).
#
# Sample line (from the real auth.log):
#   Aug  7 12:34:56 ns3124613 sshd[12345]: drop connection #11 from
#   [89.175.5.178]:54321 on [51.68.154.52]:3333 past MaxStartups
#
# The `^\s*\S+ sshd\[\d+\]: ` prefix is REQUIRED: fail2ban strips only the
# timestamp, not the hostname nor the syslog tag — without it, 0 match.
# Validated against the real auth.log: 446 matched, 0 missed.
[Definition]

failregex = ^\s*\S+ sshd\[\d+\]: drop connection #\d+ from \[<HOST>\]:\d+ on \[[^\]]+\]:\d+ past MaxStartups\s*$

ignoreregex =
